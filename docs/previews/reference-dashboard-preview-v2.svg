      </g>

      <g transform="translate(438 14)" filter="url(#softShadow)">
        <use href="#workerBase"/>
        <path class="ink" d="M-16 58 Q0 46 16 58 V112 Q7 123 0 123 Q-7 123 -16 112Z" fill="#4aa061"/>
        <rect class="ink" x="-21" y="15" width="42" height="13" rx="4" fill="#4aa061"/>
        <text class="label" x="0" y="178" text-anchor="middle">Worker</text>
      </g>

      <g transform="translate(536 14)" filter="url(#softShadow)">
        <use href="#workerBase"/>
        <path class="ink" d="M-16 58 Q0 46 16 58 V112 Q7 123 0 123 Q-7 123 -16 112Z" fill="#53a7d8"/>
        <path class="ink" d="M-18 21 Q0 4 18 21 V32 H-18Z" fill="#5db1e3"/>
