<svg xmlns="http://www.w3.org/2000/svg" width="1408" height="768" viewBox="0 0 1408 768">
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e5eef2"/>
      <stop offset=".55" stop-color="#cfdae0"/>
      <stop offset="1" stop-color="#bac7ce"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbfc"/>
      <stop offset=".52" stop-color="#b8c6cc"/>
      <stop offset="1" stop-color="#788891"/>
    </linearGradient>
    <linearGradient id="tileLight" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#edf5f7"/>
      <stop offset="1" stop-color="#cfdde2"/>
    </linearGradient>
    <pattern id="grid26" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="url(#tileLight)"/>
      <path d="M26 0H0V26" fill="none" stroke="#93a5ad" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="2" flood-color="#1a2327" flood-opacity=".28"/>
    </filter>
    <style>
      .h1 { font: 900 27px Arial, sans-serif; fill:#050607; letter-spacing:-1.2px; }
      .h2 { font: 900 20px Arial, sans-serif; fill:#050607; }
      .small { font: 800 12px Arial, sans-serif; fill:#10181b; }
      .label { font: 900 14px Arial, sans-serif; fill:#050607; }
      .micro { font: 700 10px Arial, sans-serif; fill:#26353a; }
      .panel { fill:rgba(238,246,249,.58); stroke:#0b1113; stroke-width:2; }
      .line { stroke:#0b1113; stroke-width:2; fill:none; }
      .card { fill:#d5e1e7; stroke:#93a5ad; stroke-width:1.4; }
      .ink { stroke:#0b1113; stroke-width:3; stroke-linejoin:round; stroke-linecap:round; }
      .thinInk { stroke:#0b1113; stroke-width:1.6; stroke-linejoin:round; stroke-linecap:round; }
      .screen { fill:#172f35; stroke:#2d464d; stroke-width:3; }
      .screenGrid { stroke:#31545b; stroke-width:1; opacity:.75; }
      .neon { fill:none; stroke:#5df0bf; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
      .orangeLine { fill:none; stroke:#f0a457; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
      .redLine { fill:none; stroke:#ee6c63; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
      .roomWall { fill:#d8e7eb; stroke:#050607; stroke-width:4; }
      .plant { fill:#5fab58; stroke:#245b2d; stroke-width:2; }
      .pot { fill:#b08355; stroke:#65472b; stroke-width:2; }
    </style>

    <g id="workerBase">
      <ellipse cx="0" cy="131" rx="24" ry="7" fill="#7f8b91" opacity=".42"/>
      <path class="ink" d="M-16 58 Q0 46 16 58 V112 Q7 123 0 123 Q-7 123 -16 112Z" fill="#eef4f1"/>
      <path class="ink" d="M-13 112 L-17 144 H-3 L0 119Z" fill="#1b2529"/>
      <path class="ink" d="M13 112 L17 144 H3 L0 119Z" fill="#1b2529"/>
      <path class="ink" d="M-17 63 L-31 99 H-20 L-12 75Z" fill="#eef4f1"/>
      <path class="ink" d="M17 63 L31 99 H20 L12 75Z" fill="#eef4f1"/>
      <circle class="ink" cx="0" cy="34" r="21" fill="#e9b890"/>
      <path class="ink" d="M-20 30 Q-7 8 8 13 Q20 16 21 35 Q10 25 -3 27 Q-12 27 -20 35Z" fill="#1a1918"/>
      <circle cx="-7" cy="37" r="2.5" fill="#101010"/>
      <circle cx="8" cy="37" r="2.5" fill="#101010"/>
      <path d="M-6 49 Q0 53 7 49" fill="none" stroke="#5c2f28" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1408" height="768" fill="url(#page)"/>

  <!-- CHARACTER ROSTER -->
  <g transform="translate(22 22)">
