      <g transform="translate(520 158)"><rect width="70" height="124" fill="#eef4f3" stroke="#6e7e84" stroke-width="4"/><rect x="12" y="24" width="46" height="20" class="green"/><rect x="12" y="58" width="46" height="20" class="green"/></g>
