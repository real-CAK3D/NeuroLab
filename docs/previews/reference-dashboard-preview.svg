        <rect x="-14" y="44" width="28" height="50" rx="8" fill="#20282d" stroke="#0b0f11" stroke-width="3"/>
        <circle cx="0" cy="28" r="17" fill="#e7ba91" stroke="#0b0f11" stroke-width="3"/>
        <path d="M-17 26 Q0 2 17 26 V15 Q0 2 -17 15 Z" fill="#111"/>
        <rect x="-18" y="92" width="13" height="36" rx="4" fill="#20282d" stroke="#0b0f11" stroke-width="3"/>
        <rect x="5" y="92" width="13" height="36" rx="4" fill="#20282d" stroke="#0b0f11" stroke-width="3"/>
      </g>
      <g transform="translate(48 18)"><use href="#sprite"/><text class="label" text-anchor="middle" x="0" y="198">The Boss</text></g>
      <g transform="translate(146 18)"><use href="#sprite"/><rect x="-14" y="44" width="28" height="50" rx="8" fill="#263d5b"/><text class="label" text-anchor="middle" x="0" y="198">Boss Exec</text></g>
      <g transform="translate(244 18)"><use href="#sprite"/><rect x="-14" y="44" width="28" height="50" rx="8" fill="#eff7f5"/><rect x="-17" y="12" width="34" height="12" fill="#4aa86b"/><text class="label" text-anchor="middle" x="0" y="198">Cultivation</text></g>
      <g transform="translate(342 18)"><use href="#sprite"/><rect x="-14" y="44" width="28" height="50" rx="8" fill="#eff7f5"/><text class="label" text-anchor="middle" x="0" y="198">Operations</text></g>
      <g transform="translate(440 18)"><use href="#sprite"/><rect x="-14" y="44" width="28" height="50" rx="8" fill="#4aa86b"/><rect x="-17" y="12" width="34" height="12" fill="#4aa86b"/><text class="label" text-anchor="middle" x="0" y="198">Worker</text></g>
      <g transform="translate(538 18)"><use href="#sprite"/><rect x="-14" y="44" width="28" height="50" rx="8" fill="#53a7d8"/><text class="label" text-anchor="middle" x="0" y="198">Processing</text></g>
