      <g transform="translate(14 166)"><path d="M0 20 H160 M22 20 V66 M66 20 V66 M110 20 V66 M154 20 V66" stroke="#50656c" stroke-width="7" fill="none"/><circle cx="22" cy="74" r="7" fill="#c54f4f"/><circle cx="66" cy="74" r="7" fill="#d7a34b"/><circle cx="110" cy="74" r="7" fill="#5ca4d8"/><circle cx="154" cy="74" r="7" fill="#63ad65"/></g>
      <g transform="translate(270 166)"><rect width="160" height="62" fill="#b9c5c9" stroke="#52636a" stroke-width="4"/><path d="M12 12 H148 M12 28 H148 M12 44 H148" stroke="#879ba3"/><circle cx="32" cy="70" r="8" fill="#57666c"/><circle cx="128" cy="70" r="8" fill="#57666c"/></g>
