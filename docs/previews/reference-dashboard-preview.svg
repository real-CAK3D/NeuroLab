      <g transform="translate(240 0)"><rect x="-34" y="84" width="68" height="26" fill="#cbb087" stroke="#684f35"/><circle class="green" cx="-22" cy="54" r="28"/><circle class="green" cx="0" cy="32" r="34"/><circle class="green" cx="25" cy="58" r="28"/><text class="label" x="0" y="136" text-anchor="middle">Mother</text></g>
