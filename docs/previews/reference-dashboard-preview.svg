<svg xmlns="http://www.w3.org/2000/svg" width="1408" height="768" viewBox="0 0 1408 768">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#dfe9ee"/>
      <stop offset="1" stop-color="#bfcdd4"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#d9e4e8"/>
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#91a3ab" stroke-width="1"/>
    </pattern>
    <style>
      .title { font: 800 26px Arial, sans-serif; fill: #050607; letter-spacing: -1px; }
      .subtitle { font: 800 20px Arial, sans-serif; fill: #050607; }
      .label { font: 700 14px Arial, sans-serif; fill: #050607; }
      .tiny { font: 700 12px Arial, sans-serif; fill: #1c2b30; }
      .panel { fill: rgba(237,245,248,.52); stroke: #0d1518; stroke-width: 2; }
      .cut { fill: none; stroke: #0d1518; stroke-width: 2; }
      .card { fill: #d4e0e5; stroke: #8b9ca4; stroke-width: 1; }
      .black { stroke: #050607; stroke-width: 5; }
      .wall { fill: #dce8ea; stroke: #050607; stroke-width: 4; }
      .screen { fill: #173238; stroke: #344b52; stroke-width: 3; }
      .screenLine { fill: none; stroke: #69d7ba; stroke-width: 3; }
      .green { fill: #5aa75e; stroke: #1d4c2b; stroke-width: 2; }
      .accent { fill: #47b899; }
    </style>
  </defs>

  <rect width="1408" height="768" fill="url(#bg)"/>

  <g transform="translate(24 22)">
